<body>
    <!-- CSS(Cascading Style Sheets) -- це окрема мова, яка працює в купі тільки з HTML. Дозволяє задавати стилі елементам HTML. Наприклад: колір, розмір шрифту, розмір елементу, ширина висота, анімації, поведінка 
    Стилі можна задавати 3 способами:
    1) Використовувати атрибут style в тезі 
    -->
    <!-- Стилі для роботи з текстом -->
    <p style="

    /* Колір тексту, приміняється тільки для тексту
    Можна задавати трьома способами:
    1. Назва кольору
    2. rgb(0-255, 0-255, 0-255)
    3. hex(#abceda)
    */

    /* color:rgb(0,0,255); */
    /* color:#b47070; */
    /* color: rgb(0-255, 0-255, 0-255, 0-1) */
    color: rgb(255, 0, 0);

    /* відповідає за фоновий колір, колір задається по тому ж принципу як color */
    background-color: rgb(59, 161, 161);

    /* Розмір тексту
    1. Заготовлені: large, small, xx-small, xx-large
    Відносні - використовуються в адаптивному дизайні(наприклад щоб один сайт нормально відображався як на екрані смартфону так і на моніторі ПК)
    - відстоки
    - em
    - vw - розмір елементу буде залежати від ширину вікна браузера, 1vw - 1%від ширини екрану
    - vh - розмір елементу буде залежати від висоти вікна браузера, 1vh - 1%від висоти екрану
    Абсолютні:
    - у пікселях - це одиниця яка прив'ящаюється до фізичного пікселя вашого монітору. Використовується часто, можна вказати точний розмір як тексту так і будь-якого елементу
    - у пунктах
    4. сантиметри, дюйми
    */
    /* font-size:xx-large; */
    font-size: 50px;

    /* ширина тексту: можна задавати словом, або цифрою(100-900) */
    font-weight:900;
    /* Задати текст курсивом */
    font-style:italic;
    /* Обрати шрифт для тексту, э стандартні, які підтримує операційна система, додатково, шрифти можна завантажувати і ставити свої */
    font-family: Arial, Helvetica, sans-serif;

    /* Лінія для тексту,(підкреселенний, закресленний, надкреслений) */
    text-decoration-line: underline;
    /* налаштування цієї лінії */
    text-decoration-color: black;
    text-decoration-thickness: 8px;
    text-decoration-style:dotted;
    /* Регістр тексту:
    - uppercase все з великої літери
    - lowercase все з маленької літери
    - capitalize кожне слово перша літера велика
    */
    text-transform:capitalize;

    /* відстань між словами */
    word-spacing: 30px; 
    /* відстань між літерами */
    letter-spacing: 10px;

    /* тінь для тексту */
    text-shadow: 4px 4px 5px black;
    ">Just a text</p>

    <p style="font-size: 4vw;">Розмір цього тексту буде залежати від ширини вікна</p>
    <p style="font-size: 4vh;">Розмір цього тексту буде залежати від висоти вікна</p>

    <h1>Hello</h1>
    <h1>h12</h1>

    <!-- Створити файл стилів
     Прописати стиль для span:
     колір червоний
     текст закреслений
     текст жирний
    Надсилаєте скріншот
    Файл index.html index.css -->
    <span>Span1</span>
    <span>Span2</span>
</body>
